<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ami 작업 지도</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    background: #fff;
    color: #20242b;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
}

#map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   상단 버튼
========================= */

.top-buttons {
    position: absolute;
    z-index: 20;
    top: 16px;
    left: 16px;
    right: 16px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.top-buttons button {
    pointer-events: auto;

    width: 58px;
    height: 58px;

    border: 0;
    border-radius: 17px;

    background: #293141;
    color: #fff;

    box-shadow: 0 5px 15px rgba(0,0,0,.18);

    font-size: 29px;
    cursor: pointer;
}

.menu-icon {
    font-size: 31px !important;
    line-height: 1;
}

.search-icon {
    font-size: 31px !important;
}

/* =========================
   우측 하단 현재위치
========================= */

.location-button {
    position: absolute;
    z-index: 20;

    right: 16px;
    bottom: 18px;

    width: 58px;
    height: 58px;

    border: 0;
    border-radius: 50%;

    background: #fff;

    box-shadow: 0 4px 15px rgba(0,0,0,.2);

    font-size: 28px;
    cursor: pointer;
}

/* =========================
   설정 패널
========================= */

.side-panel {
    position: absolute;
    z-index: 50;

    top: 0;
    left: 0;

    width: min(330px, 88vw);
    height: 100%;

    background: #fff;

    transform: translateX(-105%);
    transition: transform .25s ease;

    box-shadow: 5px 0 20px rgba(0,0,0,.18);

    overflow-y: auto;
}

.side-panel.open {
    transform: translateX(0);
}

.panel-header {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #eee;
}

.panel-header h2 {
    margin: 0;
    font-size: 22px;
}

.panel-close {
    border: 0;
    background: none;

    font-size: 28px;
    cursor: pointer;
}

.panel-body {
    padding: 20px;
}

.panel-section {
    margin-bottom: 26px;
}

.panel-section h3 {
    margin: 0 0 12px;

    font-size: 16px;
}

.panel-section p {
    margin: 7px 0;

    font-size: 13px;
    line-height: 1.6;
    color: #777;
}

.api-input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid #d8dce2;
    border-radius: 10px;

    font-size: 14px;
    outline: none;
}

.api-input:focus {
    border-color: #4285f4;
}

.save-api {
    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #4285f4;
    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.clear-api {
    width: 100%;

    margin-top: 8px;

    padding: 11px;

    border: 1px solid #ddd;
    border-radius: 10px;

    background: white;
    color: #666;

    cursor: pointer;
}

.api-status {
    margin-top: 10px;

    padding: 10px;

    border-radius: 9px;

    background: #f5f6f8;

    font-size: 12px;
    color: #555;
}

/* =========================
   검색창
========================= */

.search-box {
    position: absolute;
    z-index: 30;

    top: 86px;
    left: 16px;
    right: 16px;

    display: none;

    background: white;

    border-radius: 13px;

    box-shadow: 0 5px 20px rgba(0,0,0,.18);

    padding: 10px;
}

.search-box.open {
    display: flex;
}

.search-input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    padding: 10px;

    font-size: 15px;
}

.search-submit {
    width: 44px;

    border: 0;
    border-radius: 9px;

    background: #293141;
    color: white;

    font-size: 18px;
}

/* =========================
   리스트
========================= */

.list-panel {
    position: absolute;
    z-index: 35;

    left: 12px;
    right: 12px;
    bottom: 12px;

    max-height: 55vh;

    background: white;

    border-radius: 17px;

    box-shadow: 0 5px 25px rgba(0,0,0,.2);

    display: none;

    overflow: hidden;
}

.list-panel.open {
    display: block;
}

.list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 17px;

    border-bottom: 1px solid #eee;
}

.list-header strong {
    font-size: 17px;
}

.list-close {
    border: 0;
    background: none;

    font-size: 22px;
}

.list-items {
    max-height: calc(55vh - 55px);
    overflow-y: auto;
}

.list-item {
    padding: 13px 17px;

    border-bottom: 1px solid #f0f0f0;

    cursor: pointer;
}

.list-item strong {
    display: block;
    font-size: 15px;
}

.list-item span {
    display: block;

    margin-top: 4px;

    font-size: 12px;
    color: #777;
}

/* =========================
   마커
========================= */

/*
  기존 큰 원형 마커 대신
  아주 작은 물방울 형태
*/

.custom-marker {
    position: relative;

    width: 26px;
    height: 26px;

    cursor: pointer;
}

.custom-marker::before {
    content: "";

    position: absolute;

    width: 20px;
    height: 20px;

    left: 3px;
    top: 2px;

    background: #3d4655;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow:
        0 2px 5px rgba(0,0,0,.25);
}

.custom-marker .number {
    position: absolute;

    left: 0;
    top: 2px;

    width: 26px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 10px;
    font-weight: 700;

    z-index: 2;
}

/* 상태별 색상 */

.custom-marker.pending::before {
    background: #4285f4;
}

.custom-marker.complete::before {
    background: #7b818a;
}

.custom-marker.unavailable::before {
    background: #e74c4c;
}

/* =========================
   상세 팝업
========================= */

.detail-panel {
    position: absolute;
    z-index: 45;

    left: 0;
    right: 0;
    bottom: 0;

    background: white;

    border-radius: 20px 20px 0 0;

    box-shadow: 0 -5px 25px rgba(0,0,0,.18);

    transform: translateY(105%);
    transition: transform .25s ease;

    max-height: 78vh;

    overflow-y: auto;
}

.detail-panel.open {
    transform: translateY(0);
}

.detail-handle {
    width: 42px;
    height: 5px;

    margin: 10px auto 5px;

    border-radius: 10px;

    background: #c8ccd2;
}

.detail-content {
    padding: 10px 17px 25px;
}

/* 주소 */

.address-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;

    margin-bottom: 4px;
}

.address {
    flex: 1;

    font-size: 21px;
    font-weight: 800;

    line-height: 1.35;
}

.copy-button {
    border: 0;
    background: none;

    color: #9da3ac;

    font-size: 18px;

    padding: 3px;
}

/* 버튼 */

.map-links {
    display: flex;
    gap: 6px;

    margin-top: 4px;
}

.map-links button {
    border: 0;
    border-radius: 8px;

    padding: 9px 12px;

    background: #4285f4;
    color: white;

    font-weight: 700;

    cursor: pointer;
}

.close-detail {
    margin-left: auto;

    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 9px;

    background: #e8ebef;

    font-size: 20px;
}

.detail-sub {
    margin-top: 12px;

    color: #9ca2aa;

    font-size: 15px;
}

.work-info {
    margin-top: 15px;

    padding-top: 14px;

    border-top: 1px solid #eee;
}

.work-info p {
    margin: 7px 0;

    font-size: 14px;
}

.work-info strong {
    color: #555;
}

/* 상태 버튼 */

.status-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr 1fr;

    gap: 8px;

    margin-top: 18px;
}

.status-buttons button {
    min-height: 54px;

    border-radius: 12px;

    background: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.reset-button {
    border: 2px solid #7c848e;
    color: #68717c;
}

.hold-button {
    border: 2px solid #4285f4;
    color: #4285f4;
}

.unavailable-button {
    border: 2px solid #e74c4c;
    color: #e74c4c;
}

/* 불가 사유 */

.reason-box {
    display: none;

    margin-top: 10px;
}

.reason-box.open {
    display: flex;
    gap: 7px;
}

.reason-input {
    flex: 1;

    min-width: 0;

    padding: 13px;

    border: 1px solid #ddd;
    border-radius: 10px;

    font-size: 14px;
}

.reason-save {
    width: 70px;

    border: 0;
    border-radius: 10px;

    background: #e74c4c;
    color: white;

    font-weight: 700;
}

/* 계기 검색 */

.meter-row {
    display: flex;

    gap: 7px;

    margin-top: 12px;
}

.meter-input {
    flex: 1;

    padding: 13px;

    border: 1px solid #ddd;
    border-radius: 10px;

    font-size: 14px;
}

.meter-clear {
    width: 46px;

    border: 0;
    border-radius: 10px;

    background: #f0f1f3;

    font-size: 20px;
}

/* 변대주 */

.transformer {
    margin-top: 13px;

    padding: 12px;

    background: #eef5ff;

    border-top: 1px solid #d9e8ff;

    border-bottom: 1px solid #d9e8ff;

    color: #2864bd;

    font-weight: 700;
}

.transformer span {
    color: #d94141;
}

/* 리스트 상태 */

.status-dot {
    display: inline-block;

    width: 8px;
    height: 8px;

    margin-right: 5px;

    border-radius: 50%;

    background: #4285f4;
}

.status-dot.complete {
    background: #7b818a;
}

.status-dot.unavailable {
    background: #e74c4c;
}

/* 토스트 */

.toast {
    position: absolute;
    z-index: 100;

    left: 50%;
    bottom: 80px;

    transform: translateX(-50%) translateY(20px);

    background: rgba(32,36,43,.92);
    color: white;

    padding: 10px 15px;

    border-radius: 10px;

    font-size: 13px;

    opacity: 0;
    pointer-events: none;

    transition: .2s;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div id="app">

    <div id="map"></div>

    <!-- 상단 버튼 -->
    <div class="top-buttons">

        <button
            class="menu-icon"
            id="menuButton"
            aria-label="메뉴">
            ☰
        </button>

        <button
            class="search-icon"
            id="searchButton"
            aria-label="검색">
            ⌕
        </button>

    </div>

    <!-- 검색 -->
    <div class="search-box" id="searchBox">

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="주소 또는 장소 검색">

        <button
            id="searchSubmit"
            class="search-submit">
            🔍
        </button>

    </div>

    <!-- 현재 위치 -->
    <button
        id="locationButton"
        class="location-button"
        aria-label="현재 위치">
        ◎
    </button>

    <!-- 메뉴 -->
    <aside id="sidePanel" class="side-panel">

        <div class="panel-header">

            <h2>⚙ 설정</h2>

            <button
                id="panelClose"
                class="panel-close">
                ×
            </button>

        </div>

        <div class="panel-body">

            <div class="panel-section">

                <h3>카카오 지도 API</h3>

                <p>
                    카카오 JavaScript 키만 입력합니다.
                </p>

                <p>
                    REST API 키는 사용하지 않습니다.
                </p>

                <input
                    id="jsKeyInput"
                    class="api-input"
                    type="password"
                    autocomplete="off"
                    placeholder="JavaScript 키">

                <button
                    id="saveApi"
                    class="save-api">
                    저장하고 지도 불러오기
                </button>

                <button
                    id="clearApi"
                    class="clear-api">
                    저장된 API 키 삭제
                </button>

                <div
                    id="apiStatus"
                    class="api-status">
                    API 키가 설정되지 않았습니다.
                </div>

            </div>

            <div class="panel-section">

                <h3>작업</h3>

                <p>
                    지도에서 마커를 누르면 작업 정보를 확인하고
                    완료/보류/불가 상태를 변경할 수 있습니다.
                </p>

            </div>

        </div>

    </aside>

    <!-- 리스트 -->
    <section id="listPanel" class="list-panel">

        <div class="list-header">

            <strong>작업 목록</strong>

            <button
                id="listClose"
                class="list-close">
                ×
            </button>

        </div>

        <div
            id="listItems"
            class="list-items">
        </div>

    </section>

    <!-- 상세 -->
    <section
        id="detailPanel"
        class="detail-panel">

        <div class="detail-handle"></div>

        <div class="detail-content">

            <div class="address-row">

                <div
                    id="detailAddress"
                    class="address">
                </div>

                <button
                    id="copyAddress"
                    class="copy-button">
                    ▣
                </button>

            </div>

            <div
                id="detailJibun"
                class="detail-sub">
            </div>

            <div class="map-links">

                <button id="navTmap">
                    티맵
                </button>

                <button id="navNaver">
                    네이버
                </button>

                <button id="navKakao">
                    카카오
                </button>

                <button
                    id="detailClose"
                    class="close-detail">
                    ×
                </button>

            </div>

            <div
                id="detailDate"
                class="detail-sub">
            </div>

            <div class="work-info">

                <p>
                    <strong>변대주</strong>
                    <span id="detailTransformer"></span>
                </p>

                <p>
                    <strong>제조사</strong>
                    <span id="detailMaker"></span>
                </p>

                <p>
                    <strong>작업번호</strong>
                    <span id="detailWorkNo"></span>
                </p>

            </div>

            <div class="status-buttons">

                <button
                    id="resetStatus"
                    class="reset-button">
                    🔄 초기화
                </button>

                <button
                    id="holdStatus"
                    class="hold-button">
                    ⏸ 보류
                </button>

                <button
                    id="unavailableStatus"
                    class="unavailable-button">
                    ❌ 불가
                </button>

            </div>

            <div
                id="reasonBox"
                class="reason-box">

                <input
                    id="reasonInput"
                    class="reason-input"
                    placeholder="불가 사유">

                <button
                    id="saveReason"
                    class="reason-save">
                    저장
                </button>

            </div>

            <div class="meter-row">

                <input
                    id="meterInput"
                    class="meter-input"
                    inputmode="numeric"
                    placeholder="계기 검색 (숫자 2자리 이상)">

                <button
                    id="meterClear"
                    class="meter-clear">
                    ×
                </button>

            </div>

            <div
                id="meterResult"
                class="detail-sub">
            </div>

        </div>

    </section>

    <div
        id="toast"
        class="toast">
    </div>

</div>


<script>
/* ============================================================
   Ami 작업 지도
   REST API KEY 사용 안 함
   JavaScript KEY만 사용
============================================================ */

const STORAGE_API_KEY = "ami_kakao_js_key";
const STORAGE_WORKS = "ami_work_status_v1";

let kakaoLoaded = false;
let map = null;
let geocoder = null;

let markers = [];
let selectedWork = null;

let works = [];


/* ============================================================
   작업 데이터
   ------------------------------------------------------------
   실제 작업 데이터를 사용할 경우 이 배열의 내용을
   실제 데이터로 교체하면 됩니다.
============================================================ */

const WORK_DATA = [

    {
        id: "work-001",
        lat: 37.5346,
        lng: 126.9072,

        address: "서울특별시 은평구 응암로22길 7-6",
        jibun: "서울특별시 은평구 응암동 427-145",

        date: "8월 19일 작업",

        transformer: "9627F5125M",
        transformerName: "K-DCU",

        maker: "AMIGO",

        workNo: "24530249542",

        meter: "201",

        count: 1
    },

    {
        id: "work-002",
        lat: 37.5352,
        lng: 126.9090,

        address: "서울특별시 은평구 응암로22길 8",
        jibun: "서울특별시 은평구 응암동 427-150",

        date: "8월 19일 작업",

        transformer: "9627F5125M",
        transformerName: "K-DCU",

        maker: "AMIGO",

        workNo: "24530248803",

        meter: "301",

        count: 1
    },

    {
        id: "work-003",
        lat: 37.5335,
        lng: 126.9102,

        address: "서울특별시 은평구 응암로22길 10",
        jibun: "서울특별시 은평구 응암동 427-152",

        date: "8월 19일 작업",

        transformer: "9627F5125M",
        transformerName: "K-DCU",

        maker: "AMIGO",

        workNo: "24530248804",

        meter: "401",

        count: 1
    },

    {
        id: "work-004",
        lat: 37.5325,
        lng: 126.9081,

        address: "서울특별시 은평구 응암로22길 12",
        jibun: "서울특별시 은평구 응암동 427-154",

        date: "8월 19일 작업",

        transformer: "9627F5125M",
        transformerName: "K-DCU",

        maker: "AMIGO",

        workNo: "24530248805",

        meter: "501",

        count: 1
    },

    {
        id: "work-005",
        lat: 37.5364,
        lng: 126.9110,

        address: "서울특별시 은평구 응암로22길 15",
        jibun: "서울특별시 은평구 응암동 427-160",

        date: "8월 19일 작업",

        transformer: "9627F5125M",
        transformerName: "K-DCU",

        maker: "AMIGO",

        workNo: "24530248806",

        meter: "601",

        count: 5
    }

];


/* ============================================================
   초기화
============================================================ */

function initApp() {

    works = WORK_DATA.map(item => ({
        ...item,
        status: "pending",
        reason: ""
    }));

    loadSavedStatus();
    updateList();

    const key = localStorage.getItem(STORAGE_API_KEY);

    if (key) {

        document.getElementById("jsKeyInput").value = key;

        document.getElementById("apiStatus").textContent =
            "JavaScript 키가 저장되어 있습니다.";

        loadKakao(key);

    } else {

        openSettings();

    }
}


/* ============================================================
   저장된 작업 상태 불러오기
============================================================ */

function loadSavedStatus() {

    try {

        const saved =
            JSON.parse(localStorage.getItem(STORAGE_WORKS) || "{}");

        works.forEach(work => {

            if (saved[work.id]) {

                work.status =
                    saved[work.id].status || "pending";

                work.reason =
                    saved[work.id].reason || "";
            }

        });

    } catch (e) {

        console.warn(e);

    }
}


/* ============================================================
   작업 상태 저장
============================================================ */

function saveWorkStatus() {

    const data = {};

    works.forEach(work => {

        data[work.id] = {
            status: work.status,
            reason: work.reason
        };

    });

    localStorage.setItem(
        STORAGE_WORKS,
        JSON.stringify(data)
    );
}


/* ============================================================
   카카오 JavaScript SDK 로딩
============================================================ */

function loadKakao(key) {

    if (!key) {

        showToast("JavaScript 키를 입력하세요.");

        return;
    }

    if (window.kakao && window.kakao.maps) {

        kakaoLoaded = true;

        kakao.maps.load(startMap);

        return;
    }

    const oldScript =
        document.getElementById("kakao-sdk");

    if (oldScript) {

        oldScript.remove();

    }

    const script =
        document.createElement("script");

    script.id = "kakao-sdk";

    /*
       JavaScript KEY만 사용합니다.

       services 라이브러리를 함께 불러와
       kakao.maps.services.Geocoder()를 사용합니다.
    */

    script.src =
        "https://dapi.kakao.com/v2/maps/sdk.js" +
        "?appkey=" +
        encodeURIComponent(key) +
        "&libraries=services" +
        "&autoload=false";

    script.onload = function () {

        kakaoLoaded = true;

        kakao.maps.load(startMap);

    };

    script.onerror = function () {

        showToast(
            "카카오 지도 SDK를 불러오지 못했습니다. 도메인 설정을 확인하세요."
        );

    };

    document.head.appendChild(script);
}


/* ============================================================
   지도 시작
============================================================ */

function startMap() {

    if (!window.kakao || !kakao.maps) {

        showToast("카카오 지도를 불러오지 못했습니다.");

        return;
    }

    const center =
        new kakao.maps.LatLng(
            37.5346,
            126.9072
        );

    map = new kakao.maps.Map(
        document.getElementById("map"),
        {
            center: center,
            level: 4
        }
    );

    geocoder =
        new kakao.maps.services.Geocoder();

    createMarkers();

    updateList();

    setTimeout(() => {

        map.relayout();

    }, 300);

    showToast("지도가 준비되었습니다.");
}


/* ============================================================
   작은 물방울 마커 생성
============================================================ */

function createMarkers() {

    markers.forEach(marker => {

        marker.setMap(null);

    });

    markers = [];

    works.forEach(work => {

        const position =
            new kakao.maps.LatLng(
                work.lat,
                work.lng
            );

        const element =
            document.createElement("div");

        element.className =
            "custom-marker " +
            getMarkerStatusClass(work.status);

        element.innerHTML =
            `<div class="number">${work.count || 1}</div>`;

        const overlay =
            new kakao.maps.CustomOverlay({

                position: position,

                content: element,

                yAnchor: 1.0,

                xAnchor: 0.5,

                zIndex: 3

            });

        overlay.setMap(map);

        element.addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                openDetail(work);

            }
        );

        markers.push(overlay);

    });
}


function getMarkerStatusClass(status) {

    if (status === "complete") {

        return "complete";

    }

    if (status === "unavailable") {

        return "unavailable";

    }

    return "pending";
}


/* ============================================================
   상세 팝업
============================================================ */

function openDetail(work) {

    selectedWork = work;

    document.getElementById(
        "detailAddress"
    ).textContent =
        work.address || "주소 없음";

    document.getElementById(
        "detailJibun"
    ).textContent =
        work.jibun || "";

    document.getElementById(
        "detailDate"
    ).textContent =
        work.date || "";

    document.getElementById(
        "detailTransformer"
    ).textContent =
        work.transformer || "";

    document.getElementById(
        "detailMaker"
    ).textContent =
        work.maker || "";

    document.getElementById(
        "detailWorkNo"
    ).textContent =
        work.workNo || "";

    document.getElementById(
        "reasonInput"
    ).value =
        work.reason || "";

    document.getElementById(
        "reasonBox"
    ).classList.toggle(
        "open",
        work.status === "unavailable"
    );

    document.getElementById(
        "meterInput"
    ).value =
        work.meter || "";

    document.getElementById(
        "meterResult"
    ).textContent =
        work.meter
            ? "계기번호: " + work.meter
            : "";

    document.getElementById(
        "detailPanel"
    ).classList.add("open");

}


/* ============================================================
   팝업 닫기
============================================================ */

function closeDetail() {

    document.getElementById(
        "detailPanel"
    ).classList.remove("open");

    selectedWork = null;

    document.getElementById(
        "reasonBox"
    ).classList.remove("open");

}


/* ============================================================
   상태 변경
============================================================ */

function setStatus(status) {

    if (!selectedWork) return;

    selectedWork.status = status;

    if (status !== "unavailable") {

        selectedWork.reason = "";

    }

    saveWorkStatus();

    createMarkers();

    updateList();

    /*
       사용자가 요청한 동작:
       초기화 / 보류 / 상태 변경 후 팝업 자동 닫기
    */

    closeDetail();

    showToast(
        status === "pending"
            ? "보류로 저장되었습니다."
            : status === "complete"
                ? "완료로 저장되었습니다."
                : status === "unavailable"
                    ? "불가로 저장되었습니다."
                    : "초기화되었습니다."
    );
}


/* ============================================================
   불가 버튼
============================================================ */

function showReasonInput() {

    if (!selectedWork) return;

    document.getElementById(
        "reasonBox"
    ).classList.add("open");

    document.getElementById(
        "reasonInput"
    ).focus();

}


/* ============================================================
   불가 사유 저장
============================================================ */

function saveReason() {

    if (!selectedWork) return;

    const reason =
        document.getElementById(
            "reasonInput"
        ).value.trim();

    selectedWork.status =
        "unavailable";

    selectedWork.reason =
        reason;

    saveWorkStatus();

    createMarkers();

    updateList();

    /*
       요청대로 저장 후 팝업 닫기
    */

    closeDetail();

    showToast(
        reason
            ? "불가 사유가 저장되었습니다."
            : "불가 상태가 저장되었습니다."
    );
}


/* ============================================================
   작업 목록
============================================================ */

function updateList() {

    const container =
        document.getElementById("listItems");

    if (!container) return;

    container.innerHTML = "";

    works.forEach(work => {

        const item =
            document.createElement("div");

        item.className =
            "list-item";

        let statusText = "미처리";
        let statusClass = "";

        if (work.status === "complete") {

            statusText = "완료";
            statusClass = "complete";

        } else if (work.status === "unavailable") {

            statusText = "불가";
            statusClass = "unavailable";

        } else if (work.status === "pending") {

            statusText = "보류";

        }

        item.innerHTML = `
            <strong>
                <span class="status-dot ${statusClass}"></span>
                ${work.address || "주소 없음"}
            </strong>

            <span>
                ${work.maker || ""}
                · ${work.meter || ""}
                · ${statusText}
            </span>
        `;

        item.addEventListener(
            "click",
            function() {

                closeList();

                if (map) {

                    map.setCenter(
                        new kakao.maps.LatLng(
                            work.lat,
                            work.lng
                        )
                    );

                    map.setLevel(4);

                }

                openDetail(work);

            }
        );

        container.appendChild(item);

    });
}
