<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>AMI 작업 지도</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#202124;background:#fff}body{overflow:hidden}
:root{--blue:#1d5f95;--line:#e4e7eb;--muted:#727983;--red:#d93025;--gray:#6b6b6b;--green:#188038}
.app{height:100dvh;display:grid;grid-template-rows:54px 1fr}.top{height:54px;background:#fff;border-bottom:1px solid #dfe3e7;display:flex;align-items:center;gap:7px;padding:0 8px;z-index:2000;box-shadow:0 1px 4px #00000010}.hamb{width:40px;height:38px;border:1px solid #d3d9df;border-radius:9px;background:#fff;font-size:21px;line-height:1}.brand{font-weight:800;color:#214f77;font-size:17px;white-space:nowrap}.spacer{flex:1}.branch{height:38px;max-width:150px;border:1px solid #cfd6de;border-radius:9px;background:#fff;padding:0 28px 0 10px;font-size:13px}.statusBtn{height:38px;border:1px solid #cfd6de;border-radius:9px;background:#fff;padding:0 10px;font-size:12px;white-space:nowrap}.main{position:relative;min-height:0;overflow:hidden}.map{position:absolute;inset:0;background:#e9edf1}.side{position:absolute;left:10px;top:10px;bottom:10px;width:320px;background:#fff;border:1px solid #dde2e7;border-radius:10px;box-shadow:0 4px 18px #00000018;z-index:1200;display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .18s ease}.sidehead{padding:9px;border-bottom:1px solid var(--line)}.search{display:flex;gap:5px}.search input{flex:1;min-width:0;height:37px;border:1px solid #cfd6de;border-radius:8px;padding:0 10px;font-size:13px}.search button{height:37px;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 11px}.filters{display:flex;gap:4px;margin-top:6px}.filters button{flex:1;height:30px;border:1px solid #d5dbe1;border-radius:7px;background:#fff;font-size:11px}.filters button.active{background:#edf5fb;border-color:#9ebbd6;color:#174d7b;font-weight:700}.stats{display:flex;gap:4px;margin-top:6px}.stat{flex:1;text-align:center;background:#f8fafb;border:1px solid var(--line);border-radius:7px;padding:4px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}.list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.item{padding:8px 9px;border-bottom:1px solid #eef0f2;cursor:pointer}.item.active{background:#f1f6fa;border-left:3px solid var(--blue);padding-left:6px}.item .r{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}.dot.done{background:#666}.dot.bad{background:var(--red)}.addr{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:3px}.badge{font-size:9px;padding:2px 5px;border-radius:999px;background:#eef1f4}.badge.done{background:#e3e3e3}.badge.bad{background:#ffe1df;color:#a00}.map-tools{position:absolute;right:8px;top:8px;z-index:1000;display:flex;flex-direction:column;gap:5px}.map-tools button{border:1px solid #cfd6de;background:#fff;border-radius:9px;box-shadow:0 2px 8px #0002;padding:9px 10px;font-size:11px}.progress{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:1100;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:0 2px 8px #0002;font-size:10px;display:none;white-space:nowrap}.legend{position:absolute;left:8px;bottom:8px;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:9px;box-shadow:0 2px 7px #0002}.legend span{margin-right:6px}.legend span:last-child{margin-right:0}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px}
/* Compact marker: number = number of meters at the same coordinate/address. */
.pin{width:34px;height:34px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 2px 6px #0005;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}.pin.done{background:#666}.pin.bad{background:var(--red)}.pin.mixed{background:#b26a00}.pin.geofail{background:#d97706}
.detail{font-size:12px;line-height:1.35}.detail h3{font-size:14px;margin:0 0 2px}.count{font-size:10px;color:var(--muted);margin-bottom:7px}.shared{background:#f7f8fa;border:1px solid #e4e7eb;border-radius:7px;padding:6px;margin-bottom:7px}.shared .line{display:flex;gap:6px;margin:2px 0}.shared b{width:52px;flex:none;color:#4f5862;font-size:10px}.shared span{font-size:10px;word-break:break-all}.meter{border:1px solid #e5e8eb;border-radius:7px;padding:6px;margin-top:5px}.meterhead{display:flex;align-items:center;gap:5px}.meterhead b{font-size:11px}.copy{border:1px solid #cbd3db;background:#fff;border-radius:5px;padding:2px 6px;font-size:9px}.meter p{margin:3px 0 0;color:#616a74;font-size:10px}.navs{display:flex;gap:4px;margin-top:7px}.navs a{flex:1;text-align:center;text-decoration:none;color:#243447;border:1px solid #cbd3db;border-radius:6px;padding:6px 3px;font-size:10px;background:#fff}.state{display:flex;gap:4px;margin-top:7px}.state button{flex:1;height:32px;border:0;border-radius:7px;color:#fff;font-weight:700;font-size:11px}.donebtn{background:#666}.badbtn{background:#d93025}.reason{display:none;width:100%;height:42px;margin-top:5px;border:1px solid #d2d8df;border-radius:6px;padding:6px;font-size:10px;resize:none}.saveReason{display:none;margin-top:4px;width:100%;height:29px;border:0;border-radius:6px;background:#d93025;color:#fff;font-size:10px;font-weight:700}.detail .status{font-size:10px;margin-top:5px;color:#6a737d}.resetbtn{background:#6b7280}.detail{background:#fff;border-radius:10px;padding:2px;min-width:260px;max-width:340px}.detail .state .resetbtn{background:#6b7280}.detail .copy{cursor:pointer}

 .app{grid-template-rows:52px 1fr}.top{height:52px;padding:0 6px;gap:5px}.brand{font-size:16px}.branch{max-width:130px;height:36px;font-size:12px}.statusBtn{height:36px;padding:0 8px}.side{top:8px;bottom:8px;left:7px;width:min(310px,calc(100vw - 14px));transform:translateX(calc(-100% - 20px));border-radius:10px}.side.open{transform:translateX(0)}.map-tools{top:8px;right:7px}.map-tools button{padding:8px 9px}.legend{display:none}.detail{min-width:0;width:calc(100vw - 50px);max-width:340px;padding:2px}.detail .state{gap:4px}.detail h3{font-size:13px}.meter{padding:5px}.map-tools .desktopOnly{display:none}

<body>
<div class="app">
<header class="top">
<button class="hamb" onclick="toggleSide()">☰</button>
<div class="brand">AMI 작업 지도</div>
<div class="spacer"></div>
<select class="branch"><option>노원도봉지사</option></select>
<button class="statusBtn" onclick="toggleSide();setTimeout(()=>document.getElementById('q').focus(),120)">작업상태</button>
</header>
<div class="main">
<div id="map" class="map"></div>
<aside id="side" class="side">
<div class="sidehead">
<div class="search"><input id="q" placeholder="주소 또는 계기번호 검색" onkeydown="if(event.key==='Enter')renderList()"><button onclick="renderList()">검색</button></div>
<div class="filters"><button class="active" onclick="setFilter('all',this)">전체</button><button onclick="setFilter('pending',this)">미처리</button><button onclick="setFilter('done',this)">완료</button><button onclick="setFilter('bad',this)">불가</button></div>
<div class="stats"><div class="stat"><b id="sAll">0</b><span>주소</span></div><div class="stat"><b id="sMeters">0</b><span>계기</span></div><div class="stat"><b id="sDone">0</b><span>완료</span></div><div class="stat"><b id="sBad">0</b><span>불가</span></div></div>
</div><div id="list" class="list"></div>
</aside>
<div class="map-tools"><button onclick="fitAll()">↔ 전체</button><button onclick="locateMe()">◎ 내 위치</button><button class="listBtn" onclick="toggleSide()">☰ 리스트</button></div>
<div id="progress" class="progress"></div>
<div class="legend"><span><i style="background:#1d5f95"></i>미처리</span><span><i style="background:#666"></i>완료</span><span><i style="background:#d93025"></i>불가</span></div>
</div></div>

const STORAGE='ami-banghak-v2026-ui4';

let saved=JSON.parse(localStorage.getItem(STORAGE)||'{}');
let filter='all'; let markers=[]; let groups=[]; let activeGroup=null; let myMarker=null; let map=null; let sdkLoaded=false; let infoWindows=[];
const mapEl=document.getElementById('map');
function $(id){return document.getElementById(id)}
function norm(s){return String(s||'').replace(/서\s*울\s*특\s*별\s*시/g,'서울특별시').replace(/도\s*봉\s*구/g,'도봉구').replace(/방\s*학\s*동/g,'방학동').replace(/\s+/g,' ').trim()}
function keyAddr(r){return norm(r.주소||r.주소그룹)}
function loadState(){DATA.forEach(r=>{const k=keyAddr(r);if(saved[k]){r.상태=saved[k].status||r.상태;r.불가사유=saved[k].reason||'';r.위도=saved[k].lat||r.위도;r.경도=saved[k].lng||r.경도;r.지오코딩상태=saved[k].geo||r.지오코딩상태;r.완료일=saved[k].doneDate||'';r.불가일=saved[k].badDate||''}})}
function saveState(k){const g=groups.find(x=>x.key===k);if(!g)return;const first=g.rows[0];const prev=saved[k]||{};const status=groupStatus(g);const now=new Date();const date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');saved[k]={status,reason:first.불가사유||'',lat:first.위도||'',lng:first.경도||'',geo:first.지오코딩상태||'',doneDate:status==='done'?(prev.doneDate||date):'',badDate:status==='bad'?(prev.badDate||date):''};localStorage.setItem(STORAGE,JSON.stringify(saved))}
function groupStatus(g){const st=g.rows.map(r=>r.상태||'미처리');if(st.every(x=>x==='완료'))return 'done';if(st.some(x=>x==='불가'))return 'bad';return 'pending'}
function buildGroups(){const m=new Map();DATA.forEach(r=>{const k=keyAddr(r);if(!m.has(k))m.set(k,{key:k,rows:[],lat:r.위도?+r.위도:null,lng:r.경도?+r.경도:null});m.get(k).rows.push(r)});groups=[...m.values()];groups.forEach(g=>{const r=g.rows.find(x=>x.위도&&x.경도);if(r){g.lat=+r.위도;g.lng=+r.경도}})}
function markerClass(g){const s=groupStatus(g);return s==='done'?'done':s==='bad'?'bad':'pending'}
function makeMarkerContent(g){return `<div class="pin ${markerClass(g)}" data-marker-key="${esc(g.key)}">${g.rows.length}</div>`}
function closeAllInfo(){infoWindows.forEach(x=>x.close());infoWindows=[]}
function openGroup(g){activeGroup=g;if(!map||!g.lat||!g.lng)return;const pos=new kakao.maps.LatLng(g.lat,g.lng);map.setCenter(pos);map.setLevel(3);const r=g.rows[0];const nav=`https://map.naver.com/v5/search/${encodeURIComponent(g.key)}`;const tmap=`tmap://search?name=${encodeURIComponent(g.key)}`;const kakao=`https://map.kakao.com/?q=${encodeURIComponent(g.key)}`;let meters=g.rows.map((x,i)=>`<div class="meter"><div class="meterhead"><b>${i+1}. ${esc(x.계기번호||'-')}</b><button class="copy" onclick="copyText('${esc(x.계기번호||'')}')">복사</button></div>${x.상호명?`<p>상호명 · ${esc(x.상호명)}</p>`:''}${x.공동주택명?`<p>공동주택명 · ${esc(x.공동주택명)}</p>`:''}</div>`).join('');const s=groupStatus(g);const reason=s==='bad'?(g.rows.find(x=>x.불가사유)?.불가사유||''):'';const content=`<div class="detail"><h3>${esc(g.key)}</h3><div class="count">계기 ${g.rows.length}대 · ${s==='done'?'완료':s==='bad'?'불가':'미처리'}${s==='done'&&r.완료일?' · 완료일 '+r.완료일:''}${s==='bad'&&r.불가일?' · 불가일 '+r.불가일:''}</div><div class="shared"><div class="line"><b>DCU ID</b><span>${esc(r.DCUID||r['DCU ID']||'-')} <button class="copy" onclick="copyText('${esc(r.DCUID||r['DCU ID']||'')}')">복사</button></span></div><div class="line"><b>변대주</b><span>${esc(r.변대주||'-')}</span></div><div class="line"><b>인입주</b><span>${esc(r.인입주||'-')}</span></div><div class="line"><b>경간거리</b><span>${esc(r.경간거리||'-')}</span></div><div class="line"><b>검침일</b><span>${esc(r.검침일||'-')}</span></div></div>${meters}<div class="navs"><a href="${tmap}">티맵</a><a target="_blank" href="${nav}">네이버</a><a target="_blank" href="${kakao}">카카오</a></div><div class="state"><button class="donebtn" onclick="setGroupStatus('${encodeURIComponent(g.key)}','완료')">✓ 완료</button><button class="badbtn" onclick="showReason('${encodeURIComponent(g.key)}')">✕ 불가</button><button class="resetbtn" onclick="resetGroup('${encodeURIComponent(g.key)}')">↺ 초기화</button></div><textarea id="reason-${safeId(g.key)}" class="reason" placeholder="불가 사유를 입력하세요">${esc(reason)}</textarea><button id="save-${safeId(g.key)}" class="saveReason" onclick="saveBad('${encodeURIComponent(g.key)}')">불가 사유 저장</button>${reason?`<div class="status">사유: ${esc(reason)}</div>`:''}</div>`;closeAllInfo();const iw=new kakao.maps.InfoWindow({content,position:pos,removable:true,zIndex:10});iw.open(map);infoWindows=[iw];setTimeout(()=>{const root=document.querySelector('.detail');if(root){root.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>copyText(b.getAttribute('data-copy')||'')))}},50);renderList()}
function makeMarker(g){const pos=new kakao.maps.LatLng(g.lat,g.lng);const overlay=new kakao.maps.CustomOverlay({position:pos,content:makeMarkerContent(g),yAnchor:1,clickable:true,zIndex:3});overlay.setMap(map);setTimeout(()=>{const el=overlay.getContent()&&document.querySelector(`[data-marker-key="${CSS.escape(g.key)}"]`);if(el)el.onclick=()=>openGroup(g)},0);return overlay}
function buildMarkers(){markers.forEach(m=>m.setMap(null));markers=[];groups.forEach(g=>{if(g.lat&&g.lng)markers.push(makeMarker(g))});updateStats()}
function updateStats(){document.getElementById('sAll').textContent=groups.length;document.getElementById('sMeters').textContent=DATA.length;document.getElementById('sDone').textContent=groups.filter(g=>groupStatus(g)==='done').length;document.getElementById('sBad').textContent=groups.filter(g=>groupStatus(g)==='bad').length}
function fitAll(){const pts=groups.filter(g=>g.lat&&g.lng);if(!pts.length){toast('좌표가 없습니다. 먼저 주소 좌표를 만들어 주세요.');return}const b=new kakao.maps.LatLngBounds();pts.forEach(g=>b.extend(new kakao.maps.LatLng(g.lat,g.lng)));map.setBounds(b,40,40,40,40)}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderList()}
function matches(g,q){if(!q)return true;const z=q.toLowerCase();return g.key.toLowerCase().includes(z)||g.rows.some(r=>String(r.계기번호||'').includes(z)||String(r.상호명||'').toLowerCase().includes(z)||String(r.공동주택명||'').toLowerCase().includes(z))}
function renderList(){const q=document.getElementById('q').value.trim();const list=document.getElementById('list');list.innerHTML='';groups.filter(g=>{const s=groupStatus(g);return (filter==='all'||s===filter)&&matches(g,q)}).forEach(g=>{const s=groupStatus(g);const el=document.createElement('div');el.className='item'+(activeGroup===g?' active':'');el.innerHTML=`<div class="r"><span class="dot ${s==='done'?'done':s==='bad'?'bad':''}"></span><div class="addr">${esc(g.key)}</div></div><div class="sub">계기 ${g.rows.length}대 · <span class="badge ${s==='done'?'done':s==='bad'?'bad':''}">${s==='done'?'완료':s==='bad'?'불가':'미처리'}</span></div>`;el.onclick=()=>{openGroup(g);if(innerWidth<=850)toggleSide()};list.appendChild(el)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeId(s){return btoa(unescape(encodeURIComponent(s))).replace(/[^a-zA-Z0-9]/g,'').slice(0,20)}
function showReason(k){const key=decodeURIComponent(k),id=safeId(key);const ta=document.getElementById('reason-'+id),btn=document.getElementById('save-'+id);if(ta){ta.style.display='block';btn.style.display='block';ta.focus()}}
function saveBad(k){const key=decodeURIComponent(k),g=groups.find(x=>x.key===key);if(!g)return;const id=safeId(key),reason=document.getElementById('reason-'+id)?.value.trim()||'';if(!reason){toast('불가 사유를 입력하세요');return}g.rows.forEach(r=>{r.상태='불가';r.불가사유=reason;r.불가일=r.불가일||today()});saveState(key);buildMarkers();openGroup(g)}
function setGroupStatus(k,status){const key=decodeURIComponent(k),g=groups.find(x=>x.key===key);if(!g)return;g.rows.forEach(r=>{r.상태=status;if(status==='완료'){r.불가사유='';r.완료일=r.완료일||today()}else if(status==='미처리'){r.완료일='';r.불가일=''}});saveState(key);buildMarkers();openGroup(g)}
function resetGroup(k){const key=decodeURIComponent(k),g=groups.find(x=>x.key===key);if(!g)return;g.rows.forEach(r=>{r.상태='미처리';r.불가사유='';r.완료일='';r.불가일=''});delete saved[key];localStorage.setItem(STORAGE,JSON.stringify(saved));buildMarkers();renderList();closeAllInfo();toast('작업 상태를 초기화했습니다')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>toast('복사했습니다')).catch(()=>{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('복사했습니다')})}
function toast(t){const p=document.getElementById('progress');p.textContent=t;p.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>p.style.display='none',1000)}
function locateMe(){if(!navigator.geolocation){toast('위치 기능을 지원하지 않습니다');return}navigator.geolocation.getCurrentPosition(pos=>{const ll=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);if(myMarker)myMarker.setMap(null);myMarker=new kakao.maps.Marker({position:ll,map});map.setCenter(ll);map.setLevel(17);toast('현재 위치로 이동했습니다')},()=>toast('위치 권한을 허용해 주세요'),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
function showProgress(t){const p=document.getElementById('progress');p.textContent=t;p.style.display='block';return p}
function openKakaoSettings(){const rem=localStorage.getItem(KAKAO_KEYS.remember)==='1';$('kakaoKeyInput').value=rem?(localStorage.getItem(KAKAO_KEYS.js)||''):sessionStorage.getItem(KAKAO_KEYS.js)||'';$('kakaoRemember').checked=rem;$('kakaoMask').style.display='block';$('kakaoSettings').style.display='block'}
function closeKakaoSettings(){$('kakaoMask').style.display='none';$('kakaoSettings').style.display='none'}
function loadKakao(jsKey){return new Promise((resolve,reject)=>{if(window.kakao&&window.kakao.maps){kakao.maps.load(()=>{sdkLoaded=true;resolve()});return}const s=document.createElement('script');s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(jsKey)}&autoload=false&libraries=services`;s.onload=()=>kakao.maps.load(()=>{sdkLoaded=true;resolve()});s.onerror=()=>reject(new Error('카카오맵 SDK를 불러오지 못했습니다. JavaScript 키의 Web 플랫폼/도메인 설정을 확인하세요.'));document.head.appendChild(s)})}
function initMap(){map=new kakao.maps.Map(mapEl,{center:new kakao.maps.LatLng(37.6662,127.0435),level:5});buildMarkers();renderList();setTimeout(fitAll,250)}
function startApp(){const rem=localStorage.getItem(KAKAO_KEYS.remember)==='1';const js=rem?localStorage.getItem(KAKAO_KEYS.js):sessionStorage.getItem(KAKAO_KEYS.js);if(!js){openKakaoSettings();return}loadKakao(js).then(initMap).catch(e=>{toast(e.message);openKakaoSettings()})}
async function geocodeAll(){const p=showProgress('주소 지오코딩 준비 중…');let targets=groups.filter(g=>!g.lat||!g.lng);if(!targets.length){p.textContent='이미 모든 주소에 좌표가 있습니다';setTimeout(()=>p.style.display='none',1200);return}for(let i=0;i<targets.length;i++){const g=targets[i];p.textContent=`주소 지오코딩 ${i+1}/${targets.length}`;try{const q=norm(g.key);const geocoder=new kakao.maps.services.Geocoder();await new Promise(resolve=>geocoder.addressSearch(q,(result,status)=>{if(status===kakao.maps.services.Status.OK&&result&&result.length){const hit=result[0];g.lat=+hit.y;g.lng=+hit.x;g.rows.forEach(x=>{x.위도=g.lat;x.경도=g.lng;x.지오코딩상태='완료'});saveState(g.key)}else g.rows.forEach(x=>x.지오코딩상태='실패');resolve()}))}catch(e){g.rows.forEach(x=>x.지오코딩상태='실패')}await new Promise(r=>setTimeout(r,80))}buildMarkers();renderList();fitAll();p.textContent='지오코딩 완료';setTimeout(()=>p.style.display='none',1200)}
function downloadCsv(){const cols=['주소','계기번호','상호명','공동주택명','DCU ID','DCUID','변대주','인입주','경간거리','검침일','상태','불가사유','위도','경도','완료일','불가일'];const lines=[cols,...DATA.map(r=>cols.map(c=>String(r[c]??'').replaceAll('"','""')))];const csv='\ufeff'+lines.map(row=>row.map(x=>'"'+x+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='방학동_AMI_작업상태.csv';a.click()}
$('kakaoCancel').onclick=closeKakaoSettings;$('kakaoMask').onclick=closeKakaoSettings;$('kakaoSave').onclick=()=>{const js=$('kakaoKeyInput').value.trim(),remember=$('kakaoRemember').checked;if(!js){toast('JavaScript 키를 입력하세요');return}sessionStorage.setItem(KAKAO_KEYS.js,js);if(remember){localStorage.setItem(KAKAO_KEYS.js,js);localStorage.setItem(KAKAO_KEYS.remember,'1')}else{localStorage.removeItem(KAKAO_KEYS.js);localStorage.setItem(KAKAO_KEYS.remember,'0')}closeKakaoSettings();loadKakao(js).then(()=>{if(!map)initMap();else{map.relayout();buildMarkers()}}).catch(e=>{toast(e.message);openKakaoSettings()})};
loadState();buildGroups();renderList();startApp();
loadState();buildGroups();buildMarkers();renderList();setTimeout(fitAll,250);
</script>

<div id="kakaoMask" style="display:none;position:fixed;inset:0;background:#0006;z-index:5000"></div>
<div id="kakaoSettings" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:14px;box-shadow:0 10px 40px #0005;z-index:5001;padding:18px">
<h3 style="margin:0 0 8px">⚙ 카카오 지도 설정</h3>
<p style="font-size:13px;line-height:1.5;margin:0 0 10px">카카오 <b>JavaScript 키</b>를 입력하세요. REST API 키는 필요하지 않습니다.</p>
<input id="kakaoKeyInput" type="password" placeholder="JavaScript 키" style="width:100%;height:42px;border:1px solid #cfd6de;border-radius:8px;padding:0 10px;font-size:14px">
<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0"><input id="kakaoRemember" type="checkbox"> 이 기기에 키 기억하기</label>
<div style="display:flex;gap:8px;justify-content:flex-end"><button id="kakaoCancel" style="height:38px;padding:0 14px;border:1px solid #ccd3da;border-radius:8px;background:#fff">닫기</button><button id="kakaoSave" style="height:38px;padding:0 14px;border:0;border-radius:8px;background:#1d5f95;color:#fff;font-weight:700">저장하고 시작</button></div>
</div>
</body></html>
