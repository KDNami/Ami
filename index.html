<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<title>AMI 작업 지도</title>
<style>
:root{
  --blue:#3f80e8;--navy:#28303f;--green:#16b889;--sky:#63b9e8;--red:#e04d52;
  --gray:#7c828a;--line:#e2e5e9;--text:#20242a;--muted:#7b8189;--bg:#f7f8fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--text);background:#fff}
button,input{font:inherit}
button{border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;background:#fff}
#map{position:absolute;inset:0}
.topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.iconbtn{pointer-events:auto;width:48px;height:48px;border-radius:14px;background:#2d3340;color:#fff;box-shadow:0 3px 12px #0003;display:flex;align-items:center;justify-content:center;font-size:25px}
.iconbtn:active{transform:scale(.96)}
.hamb{font-size:27px}
.searchIcon{font-size:24px}
.locbtn{position:absolute;right:14px;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 2px 12px #0003;font-size:25px}
.progress{position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:21;background:#fff;padding:8px 12px;border-radius:14px;box-shadow:0 2px 10px #0002;font-size:12px;display:none}
.progress.show{display:block}
.marker{width:27px;height:34px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.marker .drop{position:absolute;top:1px;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 5px #0003}
.marker .count{position:relative;z-index:2;margin-top:4px;min-width:19px;height:19px;line-height:19px;padding:0 3px;border-radius:11px;background:#fff;color:#222;font-weight:800;font-size:12px;text-align:center}
.marker.green .drop{background:var(--green)}
.marker.gray .drop{background:#7b8088}
.marker.sky .drop{background:var(--sky)}
.marker.red .drop{background:var(--red)}
.marker .count{border:1px solid #ffffffaa}

.overlay{position:fixed;inset:0;z-index:100;background:#fff;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(450px,84vw);background:#fff;z-index:110;box-shadow:8px 0 25px #0002;padding:calc(20px + env(safe-area-inset-top)) 24px 22px;overflow:auto}
.scrim{position:fixed;inset:0;background:#0005;z-index:105;display:none}
.scrim.open{display:block}
.drawer h2{font-size:18px;margin:0 0 24px;font-weight:800}
.closex{position:absolute;right:22px;top:calc(18px + env(safe-area-inset-top));font-size:28px;color:#747a82}
.section{border-top:1px solid var(--line);padding:21px 0}
.section:first-of-type{border-top:0;padding-top:0}
.label{font-size:13px;font-weight:800;color:#6b7178;margin:0 0 10px 12px}
.selectbox{height:52px;background:#353b49;border-radius:13px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:16px;font-weight:700}
.checkgroup{margin-top:8px;background:#353b49;border-radius:13px;padding:8px 16px}
.checkrow{height:37px;color:#fff;display:flex;align-items:center;gap:9px;font-size:15px}
.checkrow input{width:19px;height:19px;accent-color:#4d8df2}
.menuAction{display:flex;align-items:center;gap:15px;padding:16px 10px;font-weight:800;font-size:16px}
.menuAction .ico{width:28px;font-size:26px;color:#2f63c8}
.menuAction.red{color:#d33d42}.menuAction.red .ico{color:#d33d42}
.version{color:#a0a4aa;font-size:11px;text-align:right;margin-top:10px}
.branchModal{position:fixed;inset:0;z-index:130;background:#0004;display:none;align-items:flex-start;justify-content:center;padding-top:17vh}
.branchModal.open{display:flex}
.branchList{width:min(460px,92vw);background:#4b4b51;color:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 35px #0004}
.branchItem{height:96px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20;font-size:21px}
.branchItem:last-child{border-bottom:0}
.radio{width:30px;height:30px;border:3px solid #fff;border-radius:50%}
.branchItem.active .radio{border-color:#4285f4;box-shadow:inset 0 0 0 5px #4b4b51;background:#4285f4}

.detail{position:fixed;inset:0;z-index:80;background:#fff;display:none;overflow:hidden}
.detail.open{display:flex;flex-direction:column}
.detailHeader{flex:0 0 auto;padding:calc(13px + env(safe-area-inset-top)) 24px 9px;border-top:3px solid var(--green);box-shadow:0 1px 7px #0001;background:#fff}
.addrTitle{font-size:20px;line-height:1.25;font-weight:850;margin-right:35px}
.addrSub{margin-top:9px;color:#9aa0a7;font-size:14px}
.detailClose{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));width:42px;height:42px;border-radius:10px;background:#eef0f3;color:#3c434d;font-size:25px}
.workline{padding:12px 24px 7px;font-size:12px;color:#727982}
.statusBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px 24px}
.statusBtn{height:57px;border:3px solid #707780;border-radius:13px;background:#fff;font-size:15px;font-weight:850;color:#68707a}
.statusBtn.complete{border-color:#777d84;color:#5e666e}
.statusBtn.hold{border-color:#4389e6;color:#3574c9}
.statusBtn.unable{border-color:#df4e52;color:#d94247}
.statusBtn.active.complete{background:#777d84;color:#fff}
.statusBtn.active.hold{background:#63b9e8;color:#fff}
.statusBtn.active.unable{background:#df4e52;color:#fff}
.reasonWrap{padding:0 24px 7px;display:none}
.reasonWrap.show{display:block}
.reasonInput{width:100%;height:56px;border:2px solid var(--line);border-radius:13px;padding:0 15px;font-size:15px;outline:none}
.reasonInput:focus{border-color:#e04d52}
.reasonSave{width:100%;height:46px;margin-top:8px;border-radius:11px;background:#df4e52;color:#fff;font-weight:800}
.meterSearch{display:flex;gap:8px;padding:3px 24px 9px;border-bottom:1px solid var(--line)}
.meterSearch input{flex:1;height:51px;border:2px solid var(--line);border-radius:12px;padding:0 15px;outline:none;font-size:14px}
.meterSearch button{width:52px;height:52px;border-radius:12px;background:#f1f2f4;color:#7a8189;font-size:24px}
.groupInfo{min-height:58px;padding:10px 24px;background:#edf6ff;color:#2562aa;font-size:15px;font-weight:850;display:flex;align-items:center;gap:10px}
.copy{font-size:11px;border:1px solid #cdd3da;background:#fff;border-radius:7px;padding:5px 8px;color:#68717b;font-weight:800}
.copy:active{background:#edf0f4}
.meterList{flex:1;overflow:auto;padding:10px 24px calc(20px + env(safe-area-inset-bottom));background:#fafbfc}
.meterCard{background:#fff;border:1px solid #e0e3e7;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px #00000008}
.meterLine{display:flex;align-items:center;gap:8px;min-width:0}
.typeTag{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:32px;border-radius:7px;background:#4384e8;color:#fff;font-size:12px;font-weight:850}
.meterNo{font-size:15px;letter-spacing:.1px;font-weight:700;white-space:nowrap}
.meterNo .last2{color:#e14b51}
.meterCopy{width:27px;height:27px;border-radius:7px;background:#f0f2f4;color:#69717a;font-size:13px}
.statusMini{margin-left:auto;border:1px solid #e05a5e;color:#d84b51;background:#fff;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:850;white-space:nowrap}
.detailLine{margin-top:6px;color:#737a83;font-size:11.5px;line-height:1.55}
.detailLine b{color:#d34549}.detailLine .sep{color:#c4c8cc;margin:0 4px}
.empty{padding:40px 10px;text-align:center;color:#969ca3;font-size:14px}

.searchPanel{position:fixed;inset:0;z-index:140;background:#fff;display:none;overflow:auto}
.searchPanel.open{display:block}
.searchHead{padding:calc(15px + env(safe-area-inset-top)) 16px 12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.searchHead input{flex:1;height:47px;border:2px solid #e2e5e9;border-radius:12px;padding:0 14px;font-size:15px;outline:none}
.searchHead button{width:48px;height:48px;border-radius:12px;background:#eef0f3;font-size:23px}
.searchResults{padding:10px 16px}
.searchItem{padding:14px;border-bottom:1px solid #eee}
.searchItem b{font-size:14px}.searchItem small{display:block;color:#7e858d;margin-top:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:#262b34;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;display:none;box-shadow:0 3px 14px #0003}
.toast.show{display:block}
.loadingMask{position:fixed;inset:0;z-index:250;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loadingMask.hide{display:none}
.spinner{width:34px;height:34px;border:4px solid #e4e7eb;border-top-color:#4384e8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadingTitle{font-weight:850}.loadingSub{font-size:12px;color:#858b92}
@media(min-width:700px){
  .detail{left:auto;width:min(520px,100vw);box-shadow:-8px 0 25px #0002}
  .detail.open{display:flex}
}
</style>

    <div class="spinner"></div>
    <div class="loadingTitle">카카오 지도 준비 중</div>
    <div class="loadingSub" id="loadingSub">주소 좌표를 확인하고 있습니다.</div>
  </div>
</div>

<script>
(function(){
"use strict";
let map, geocoder, myMarker=null, myCircle=null;
let groups=[], markerRefs=[];
let activeGroup=null, selectedBranch="전체", currentDetailStatus=null;
const statusKey="ami-status-v1";
const geoKey="ami-geocode-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const clean=s=>String(s??"").replace(/\s+/g," ").trim();
const todayLabel=()=>{const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일`};

function toast(msg){
  $("toast").textContent=msg;$("toast").classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.remove("show"),1700);
}
function copyText(text){navigator.clipboard?.writeText(String(text)).then(()=>toast("복사했습니다")).catch(()=>toast("복사에 실패했습니다"))}
function loadJSON(k, fallback){try{return JSON.parse(localStorage.getItem(k)||"null")??fallback}catch(e){return fallback}}
function saveStatus(id, status, reason=""){
  const all=loadJSON(statusKey,{});
  if(status==="green") delete all[id]; else all[id]={status,reason,date:todayLabel()};
  localStorage.setItem(statusKey,JSON.stringify(all));
}
function getStatus(id){return loadJSON(statusKey,{})[id]||{status:"green",reason:"",date:""}}
function normalizeAddress(s){
  return clean(s).replace(/^(서울특별시|서울시)\s+/,"서울특별시 ");
}
function makeMarker(group){
  const st=getStatus(group.id).status||"green";
  const el=document.createElement("div");
  el.className=`marker ${st}`;
  el.innerHTML=`<div class="drop"></div><div class="count">${group.items.length}</div>`;
  el.addEventListener("click",()=>openDetail(group));
  return el;
}
function renderMarkers(){
  markerRefs.forEach(o=>o.setMap(null));markerRefs=[];
  groups.filter(g=>selectedBranch==="전체"||g.branch===selectedBranch).forEach(g=>{
    if(!g.lat) return;
    const pos=new kakao.maps.LatLng(g.lat,g.lng);
    const ov=new kakao.maps.CustomOverlay({position:pos,content:makeMarker(g),yAnchor:1.0,zIndex:3});
    ov.setMap(map);markerRefs.push(ov);g.overlay=ov;
  });
}
function refreshMarker(group){
  if(!group.overlay) return;
  group.overlay.setContent(makeMarker(group));
}
function groupKey(lat,lng){return `${Number(lat).toFixed(6)},${Number(lng).toFixed(6)}`}
function buildGroups(){
  const by=new Map();
  DATA.forEach((r,i)=>{
    r.__i=i;r.__branch=r["지사"];r.__address=normalizeAddress(r["주소"]);
    r.__type=clean(r["타입"]).replace(/타입$/,"");
    const cache=loadJSON(geoKey,{})[r.__address];
    if(cache){r.__lat=cache.lat;r.__lng=cache.lng}
  });
  DATA.forEach(r=>{
    if(r.__lat==null) return;
    const k=groupKey(r.__lat,r.__lng);
    if(!by.has(k))by.set(k,{id:k,lat:r.__lat,lng:r.__lng,branch:r.__branch,address:r.__address,items:[]});
    by.get(k).items.push(r);
  });
  groups=[...by.values()];
  groups.forEach(g=>g.items.sort((a,b)=>a["계기번호"].localeCompare(b["계기번호"])));
}
function updateProgress(done,total){
  $("progress").textContent=`주소 변환 ${done}/${total}`;
  $("progress").classList.add("show");
  $("loadingSub").textContent=`주소 좌표를 확인하고 있습니다. ${done}/${total}`;
}
async function geocodeOne(address, cache){
  if(cache[address]) return true;
  const search = (q, resolve) => {
    let settled=false;
    const finish=(ok)=>{if(settled)return;settled=true;resolve(ok)};
    const timer=setTimeout(()=>finish(false),5000);
    try{
      geocoder.addressSearch(q,(result,status)=>{
        clearTimeout(timer);
        if(status===kakao.maps.services.Status.OK && result && result[0]){
          cache[address]={lat:Number(result[0].y),lng:Number(result[0].x),at:Date.now()};
          finish(true);
        }else finish(false);
      });
    }catch(e){clearTimeout(timer);finish(false)}
  };
  const first=await new Promise(resolve=>search(address,resolve));
  if(first)return true;
  const compact=address.replace(/\s+/g," ").trim();
  if(compact!==address){
    return await new Promise(resolve=>search(compact,resolve));
  }
  return false;
}

async function geocodeAll(){
  const cache=loadJSON(geoKey,{});
  const addresses=[...new Set(DATA.map(r=>normalizeAddress(r["주소"])).filter(Boolean))];
  let done=0, success=0, failed=0;
  updateProgress(done,addresses.length);

  // 카카오 지오코더를 한 건씩 기다리면 모바일에서 수 분이 걸릴 수 있어
  // 6건씩 병렬 처리하고, 개별 요청은 5초 후 다음 주소로 넘어갑니다.
  const concurrency=6;
  for(let i=0;i<addresses.length;i+=concurrency){
    const batch=addresses.slice(i,i+concurrency);
    const results=await Promise.all(batch.map(async address=>{
      const cached=!!cache[address];
      const ok=cached ? true : await geocodeOne(address,cache);
      return {ok,cached};
    }));
    results.forEach(r=>{done++;if(r.ok)success++;else failed++});
    localStorage.setItem(geoKey,JSON.stringify(cache));
    updateProgress(done,addresses.length);
  }

  DATA.forEach(r=>{
    const c=cache[normalizeAddress(r["주소"])];
    if(c && Number.isFinite(Number(c.lat)) && Number.isFinite(Number(c.lng))){
      r.__lat=Number(c.lat);r.__lng=Number(c.lng);
    }
  });
  buildGroups();
  return {total:addresses.length,success,failed};
}
function setMapCenter(){
  const valid=groups.filter(g=>g.lat);
  if(!valid.length)return;
  const bounds=new kakao.maps.LatLngBounds();
  valid.forEach(g=>bounds.extend(new kakao.maps.LatLng(g.lat,g.lng)));
  map.setBounds(bounds);
}
function openDetail(g){
  activeGroup=g;
  $("detail").classList.add("open");
  const first=g.items[0];
  $("detailAddress").textContent=first["주소"]||"주소 없음";
  $("detailSub").textContent=[first["상호명"],first["공동주택명"]].filter(Boolean).join(" · ")||"";
  const st=getStatus(g.id);currentDetailStatus=st.status;
  $("workLine").textContent=`${st.status==="green"?"미처리":statusName(st.status)} / ${st.date||todayLabel()} 작업`;
  $("groupDcu").innerHTML=dcuHTML(first["DCUID"]);
  $("groupPole").textContent=[first["인입주"]?`인입주 ${first["인입주"]}`:"",first["검침일"]?`검침일 ${first["검침일"]}`:""].filter(Boolean).join("  ·  ");
  $("reasonInput").value=st.reason||"";
  $("reasonWrap").classList.toggle("show",st.status==="unable");
  document.querySelectorAll(".statusBtn").forEach(b=>b.classList.toggle("active",b.dataset.status===st.status));
  $("meterSearch").value="";
  renderMeters();
}
function statusName(s){return {complete:"완료",hold:"보류",unable:"불가",green:"미처리"}[s]||"미처리"}
function dcuHTML(v){
  v=String(v||"");
  if(v.length<=2)return esc(v);
  return esc(v.slice(0,-2))+`<span style="color:#e14b51">${esc(v.slice(-2))}</span>`;
}
function meterHTML(r, duplicateLast2){
  const no=String(r["계기번호"]||"");
  const last=no.slice(-2), prefix=no.slice(0,-2);
  const noHtml=duplicateLast2?`${esc(prefix)}<span class="last2">${esc(last)}</span>`:esc(no);
  const dcu=dcuHTML(r["DCUID"]);
  const status=getStatus(activeGroup.id);
  const mini=status.status==="unable"?`<span class="statusMini">불가</span>`:status.status==="complete"?`<span class="statusMini" style="color:#666;border-color:#aaa">완료</span>`:status.status==="hold"?`<span class="statusMini" style="color:#3f88b6;border-color:#8ac6e8">보류</span>`:"";
  const line2=[
    r["상호명"]?`상호명 ${esc(r["상호명"])}`:"",
    r["공동주택명"]?`공동주택 ${esc(r["공동주택명"])}`:""
  ].filter(Boolean).join(`<span class="sep">·</span>`);
  return `<div class="meterCard">
    <div class="meterLine">
      <span class="typeTag">${esc(r.__type||"")}</span>
      <span class="meterNo">${noHtml}</span>
      <button class="meterCopy" data-copy="${esc(no)}">⧉</button>
      ${mini}
    </div>
    ${line2?`<div class="detailLine">${line2}</div>`:""}
  </div>`;
}
function renderMeters(){
  if(!activeGroup)return;
  const q=clean($("meterSearch").value);
  let items=activeGroup.items;
  if(q.length>=2)items=items.filter(r=>String(r["계기번호"]).includes(q)||clean(r["상호명"]).includes(q)||clean(r["공동주택명"]).includes(q));
  const globalSuffix={};DATA.forEach(r=>{const x=String(r["계기번호"]).slice(-2);globalSuffix[x]=(globalSuffix[x]||0)+1});
  $("meterList").innerHTML=items.length?items.map(r=>meterHTML(r,globalSuffix[String(r["계기번호"]).slice(-2)]>1)).join(""):`<div class="empty">검색 결과가 없습니다.</div>`;
  $("meterList").querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();copyText(b.dataset.copy)}));
}
function closeDetail(){
  $("detail").classList.remove("open");activeGroup=null;$("reasonWrap").classList.remove("show");
}
function setStatus(status){
  if(!activeGroup)return;
  const old=getStatus(activeGroup.id).status;
  if(status==="unable"){
    if(old==="unable"){saveStatus(activeGroup.id,"green");closeDetail();refreshMarker(activeGroup);return}
    $("reasonWrap").classList.add("show");$("reasonInput").focus();return;
  }
  if(old===status){saveStatus(activeGroup.id,"green");closeDetail();refreshMarker(activeGroup);return}
  saveStatus(activeGroup.id,status);
  refreshMarker(activeGroup);closeDetail();
}
function saveUnable(){
  if(!activeGroup)return;
  const reason=clean($("reasonInput").value);
  if(!reason){toast("불가 사유를 입력해 주세요.");return}
  saveStatus(activeGroup.id,"unable",reason);refreshMarker(activeGroup);closeDetail();
}
function openDrawer(){ $("scrim").classList.add("open");$("drawer").style.display="block" }
function closeDrawer(){ $("scrim").classList.remove("open");$("drawer").style.display="none" }
function renderBranchUI(){
  const branches=[...new Set(DATA.map(r=>r["지사"]).filter(Boolean))];
  $("branchChecks").innerHTML=branches.map(b=>`<label class="checkrow"><input type="checkbox" checked data-branch="${esc(b)}"><span>${esc(b.replace("지사",""))}</span></label>`).join("");
  $("branchChecks").querySelectorAll("input").forEach(c=>c.addEventListener("change",applyBranches));
  $("branchText").textContent=selectedBranch==="전체"?"전체":selectedBranch;
}
function applyBranches(){
  const checked=[...$("branchChecks").querySelectorAll("input:checked")].map(x=>x.dataset.branch);
  selectedBranch=checked.length===1?checked[0]:"전체";
  $("branchText").textContent=selectedBranch==="전체"?"전체":selectedBranch;
  renderMarkers();
}
function openBranchModal(){
  const branches=[...new Set(DATA.map(r=>r["지사"]).filter(Boolean))];
  $("branchList").innerHTML=`<div class="branchItem ${selectedBranch==="전체"?"active":""}" data-branch="전체"><span>전체</span><span class="radio"></span></div>`+
  branches.map(b=>`<div class="branchItem ${selectedBranch===b?"active":""}" data-branch="${esc(b)}"><span>${esc(b)}</span><span class="radio"></span></div>`).join("");
  $("branchModal").classList.add("open");
  $("branchList").querySelectorAll(".branchItem").forEach(el=>el.addEventListener("click",()=>{
    selectedBranch=el.dataset.branch;
    $("branchModal").classList.remove("open");
    $("branchText").textContent=selectedBranch;
    $("branchChecks").querySelectorAll("input").forEach(c=>c.checked=selectedBranch==="전체"||c.dataset.branch===selectedBranch);
    renderMarkers();
  }));
}
function openSearch(){
  $("searchPanel").classList.add("open");$("globalSearch").focus();runGlobalSearch();
}
function runGlobalSearch(){
  const q=clean($("globalSearch").value);
  if(q.length<2){$("searchResults").innerHTML=`<div class="empty">검색어를 2자 이상 입력하세요.</div>`;return}
  const rows=[];
  DATA.forEach(r=>{
    if(String(r["계기번호"]).includes(q)||clean(r["주소"]).includes(q)||clean(r["상호명"]).includes(q)||clean(r["공동주택명"]).includes(q)){
      const g=groups.find(x=>x.items.some(i=>i.__i===r.__i));
      if(g && !rows.some(x=>x.g.id===g.id))rows.push({g,r});
    }
  });
  $("searchResults").innerHTML=rows.length?rows.slice(0,50).map(({g,r})=>`<div class="searchItem" data-g="${esc(g.id)}"><b>${esc(r["계기번호"])}</b><small>${esc(r["주소"])} · ${esc(r["공동주택명"]||r["상호명"]||"")}</small></div>`).join(""):`<div class="empty">검색 결과가 없습니다.</div>`;
  $("searchResults").querySelectorAll(".searchItem").forEach(el=>el.addEventListener("click",()=>{
    const g=groups.find(x=>x.id===el.dataset.g);if(g){$("searchPanel").classList.remove("open");map.setLevel(4);map.panTo(new kakao.maps.LatLng(g.lat,g.lng));setTimeout(()=>openDetail(g),180)}
  }));
}
function myLocation(){
  if(!navigator.geolocation){toast("이 브라우저는 위치 기능을 지원하지 않습니다.");return}
  navigator.geolocation.getCurrentPosition(p=>{
    const pos=new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude);
    if(myMarker)myMarker.setMap(null);if(myCircle)myCircle.setMap(null);
    myMarker=new kakao.maps.Marker({position:pos,map:map});
    myCircle=new kakao.maps.Circle({center:pos,radius:Math.max(p.coords.accuracy||30,30),strokeWeight:1,strokeColor:"#4285f4",strokeOpacity:.6,fillColor:"#4285f4",fillOpacity:.12,map:map});
    map.setLevel(4);map.panTo(pos);toast("현재 위치로 이동했습니다.");
  },()=>toast("현재 위치 권한을 허용해 주세요."),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
async function init(){
  if(KAKAO_JS_KEY==="YOUR_KAKAO_JAVASCRIPT_KEY"){
    $("loadingMask").innerHTML=`<div style="padding:24px;text-align:center"><b>카카오 JavaScript 키를 설정해 주세요.</b><p style="font-size:12px;color:#777;line-height:1.6">index.html 상단의 KAKAO_JS_KEY 한 줄을 본인의 키로 바꾸고 GitHub Pages에 올리면 됩니다.</p></div>`;
    return;
  }
  try{
    if(!window.kakao){
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+encodeURIComponent(KAKAO_JS_KEY)+"&libraries=services";
        s.onload=resolve;s.onerror=()=>reject(new Error("Kakao Maps SDK를 불러오지 못했습니다."));
        document.head.appendChild(s);
      });
    }
    if(!window.kakao?.maps){throw new Error("Kakao Maps SDK가 로드되지 않았습니다.")}
    kakao.maps.load(async()=>{
      map=new kakao.maps.Map($("map"),{center:new kakao.maps.LatLng(37.665,127.033),level:6});
      geocoder=new kakao.maps.services.Geocoder();
      const geoResult=await geocodeAll();
      renderBranchUI();renderMarkers();setMapCenter();
      $("loadingMask").classList.add("hide");$("progress").classList.remove("show");
      if(geoResult.failed>0){
        toast(`좌표 변환 완료 ${geoResult.success}건 / 미확인 ${geoResult.failed}건`);
      }
    });
  }catch(e){
    $("loadingMask").innerHTML=`<div style="padding:24px;text-align:center"><b>지도 초기화 실패</b><p style="font-size:12px;color:#777">${esc(e.message)}</p></div>`;
  }
}
$("menuBtn").addEventListener("click",openDrawer);
$("drawerClose").addEventListener("click",closeDrawer);
$("scrim").addEventListener("click",closeDrawer);
$("branchSelect").addEventListener("click",openBranchModal);
$("searchBtn").addEventListener("click",openSearch);
$("searchClose").addEventListener("click",()=>$("searchPanel").classList.remove("open"));
$("globalSearch").addEventListener("input",runGlobalSearch);
$("locBtn").addEventListener("click",myLocation);
$("detailClose").addEventListener("click",closeDetail);
document.querySelectorAll(".statusBtn").forEach(b=>b.addEventListener("click",()=>setStatus(b.dataset.status)));
$("reasonSave").addEventListener("click",saveUnable);
$("meterSearch").addEventListener("input",renderMeters);
$("meterSearchClear").addEventListener("click",()=>{$("meterSearch").value="";renderMeters()});
$("groupDcuCopy").addEventListener("click",()=>{if(activeGroup)copyText(String(activeGroup.items[0]["DCUID"]||"").slice(0,8))});
$("refreshBtn").addEventListener("click",()=>{renderMarkers();toast("완료 현황을 새로고침했습니다.");closeDrawer()});
$("redownloadBtn").addEventListener("click",()=>{localStorage.removeItem(statusKey);renderMarkers();toast("작업상태를 초기화했습니다.");closeDrawer()});
$("logoutBtn").addEventListener("click",()=>toast("이 파일은 별도 로그인 없이 사용하는 개인 작업용 지도입니다."));
init();
})();
</script>
</body>
</html>
