<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15161a">
<title>AMI 작업 지도</title>
<style>
:root{--green:#10b981;--gray:#7b8794;--sky:#38bdf8;--red:#ef4444;--blue:#3b82f6;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:#fff}
button,input,textarea{font:inherit}
#map{position:fixed;inset:0;background:#eee}
.topbar{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.iconbtn{width:48px;height:48px;border:0;border-radius:14px;background:rgba(25,28,34,.94);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:24px;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.iconbtn:active{transform:scale(.97)}
.searchbox{position:fixed;z-index:19;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;background:#fff;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.18);padding:10px;display:none}
.searchbox.open{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.searchbox button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 14px;font-weight:700}
.progress{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,86vw);background:rgba(255,255,255,.97);border-radius:18px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.25);display:none}
.progress.show{display:block}
.progress h3{margin:0 0 8px;font-size:17px}
.progress p{margin:0 0 12px;color:var(--muted);font-size:13px}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .15s}
.statusbadge{position:fixed;z-index:18;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:999px;padding:7px 12px;font-size:12px;box-shadow:0 3px 12px rgba(0,0,0,.14);white-space:nowrap}
.location{position:fixed;z-index:18;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));margin-bottom:44px;width:50px;height:50px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);font-size:24px;color:#111;cursor:pointer}
.drawer{position:fixed;z-index:40;inset:0 auto 0 0;width:min(330px,86vw);background:#fff;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.22);padding:calc(18px + env(safe-area-inset-top)) 18px 18px;overflow:auto}
.drawer.open{transform:translateX(0)}
.drawer .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer h2{margin:0;font-size:21px}
.drawer .close{border:0;background:#eef0f3;border-radius:10px;width:40px;height:40px;font-size:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fafafa}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.drawer .action{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;margin-top:8px}.drawer .action.danger{color:#dc2626;border-color:#fecaca;background:#fff7f7}
.drawer .note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:18px}
.overlay{position:fixed;z-index:100;inset:0;background:#f7f8fa;display:none;overflow:hidden}
.overlay.show{display:flex;flex-direction:column}
.detail-head{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fff;border-top:3px solid var(--green);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.detail-head .back{width:42px;height:42px;border:0;border-radius:11px;background:#edf0f3;font-size:23px;flex:0 0 auto}
.detail-title{min-width:0;flex:1}
.detail-title h1{font-size:20px;line-height:1.25;margin:0 0 5px;word-break:keep-all}
.detail-title .addr2{font-size:13px;color:#7b8490;line-height:1.45}
.detail-body{overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.route{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.route button{border:0;background:#3b82f6;color:#fff;border-radius:8px;padding:8px 11px;font-weight:700;font-size:13px}
.meta{background:#fff;padding:10px 14px;border-bottom:1px solid var(--line)}
.meta .line{font-size:13px;color:#6b7280;margin:3px 0}
.meta strong{color:#374151}
.workline{padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}
.actionrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px;background:#fff}
.actionrow button{height:54px;border-radius:12px;background:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn-reset{border:2px solid #6b7280;color:#59636e}
.btn-done{border:2px solid #9ca3af;color:#64748b}
.btn-hold{border:2px solid #38bdf8;color:#0284c7}
.btn-bad{border:2px solid #ef4444;color:#dc2626}
.reasonbox{display:none;padding:0 14px 12px;background:#fff}
.reasonbox.show{display:block}
.reasonbox textarea{width:100%;min-height:88px;border:2px solid #e5e7eb;border-radius:12px;padding:12px;resize:none;outline:none}
.reasonbox .save{margin-top:8px;width:100%;height:48px;border:0;border-radius:11px;background:#ef4444;color:#fff;font-weight:800}
.group-summary{padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}.group-summary .row{display:grid;grid-template-columns:72px 1fr;gap:8px;margin:5px 0}.group-summary .k{color:#8a929d}.group-summary .v{word-break:break-word}.filterbar{padding:10px 14px;background:#eef6ff;border-top:1px solid #dbeafe;border-bottom:1px solid #dbeafe;font-size:13px;color:#2563eb;font-weight:800}
.meter-list{padding:12px 14px}
.meter-card{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.meter-top{display:flex;align-items:center;gap:8px}
.meter-num{font-size:16px;font-weight:800;letter-spacing:.2px}
.copy{border:1px solid #d1d5db;background:#fff;border-radius:7px;padding:5px 7px;font-size:11px;color:#64748b}
.tag{margin-left:auto;padding:4px 7px;border-radius:6px;font-size:11px;font-weight:800}
.tag.green{color:#059669;background:#ecfdf5}.tag.gray{color:#64748b;background:#f1f5f9}.tag.sky{color:#0284c7;background:#e0f2fe}.tag.red{color:#dc2626;background:#fef2f2}
.detail-grid{display:grid;grid-template-columns:72px 1fr;gap:7px 10px;margin-top:10px;font-size:13px}
.detail-grid .k{color:#8a929d}.detail-grid .v{word-break:break-word}
.dcu{font-weight:800}.dcu .last2{color:#ef4444}
.empty{padding:28px 14px;text-align:center;color:#8b95a1}
.toast{position:fixed;z-index:200;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,24,30,.92);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:none;white-space:nowrap}
.toast.show{display:block}
@media(min-width:700px){.drawer{width:360px}.detail-head,.route,.meta,.workline,.actionrow,.reasonbox,.filterbar,.meter-list{padding-left:22px;padding-right:22px}.detail-body{max-width:760px;width:100%;margin:auto}}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="메뉴">☰</button>
  <button class="iconbtn" id="searchBtn" aria-label="검색">⌕</button>
</div>
<div class="searchbox" id="searchBox">
  <input id="searchInput" placeholder="주소 또는 계기번호 검색">
  <button id="searchGo">검색</button>
</div>
<button class="location" id="locationBtn" aria-label="현재 위치">◎</button>
<div class="statusbadge" id="statusBadge">지도 준비 중…</div>

<aside class="drawer" id="drawer">
  <div class="head"><h2>AMI 작업 지도</h2><button class="close" id="drawerClose">×</button></div>
  <div class="stats">
    <div class="stat"><b id="sAll">0</b><span>계기번호</span></div>
    <div class="stat"><b id="sMarker">0</b><span>표시 마커</span></div>
    <div class="stat"><b id="sDone">0</b><span>완료</span></div>
    <div class="stat"><b id="sHold">0</b><span>보류</span></div>
    <div class="stat"><b id="sBad">0</b><span>불가</span></div>
    <div class="stat"><b id="sPending">0</b><span>미처리</span></div>
  </div>
  <button class="action" id="addExcel">📥 엑셀 추가</button>
  <button class="action" id="backupData">💾 데이터 백업</button>
  <button class="action" id="restoreData">📂 데이터 복원</button>
  <button class="action" id="reGeocode">📍 좌표 재검색</button>
  <button class="action danger" id="resetAll">🗑️ 전체 데이터 초기화</button>
  <button class="action" id="showAll">🗺️ 전체 마커 보기</button>
  <button class="action" id="showPending">🟢 미처리 마커만 보기</button>
  <div class="note">엑셀은 이 기기의 브라우저에서만 읽고 저장합니다. 기존 데이터·좌표·작업상태는 유지한 채 새 엑셀만 추가합니다. 같은 기존 주소가 새로 들어오면 마커 숫자 위에 빨간색 <b>재</b>가 표시됩니다.</div>
</aside>
<input type="file" id="excelInput" accept=".xlsx,.xls" hidden>
<input type="file" id="restoreInput" accept=".json" hidden>

<div class="progress" id="progress">
  <h3>주소를 지도 좌표로 변환 중</h3>
  <p id="progressText">준비 중…</p>
  <div class="bar"><i id="progressBar"></i></div>
</div>

<section class="overlay" id="detailOverlay">
  <header class="detail-head">
    <button class="back" id="detailClose">‹</button>
    <div class="detail-title">
      <h1 id="detailTitle">주소</h1>
      <div class="addr2" id="detailAddress"></div>
    </div>
  </header>
  <div class="detail-body">
    <div class="route">
      <button id="tmapBtn">티맵</button>
      <button id="naverBtn">네이버</button>
      <button id="kakaoBtn">카카오</button>
    </div>
    <div class="meta">
      <div class="line"><strong id="statusText">미처리</strong> · <span id="workDate">작업일 미기록</span></div>
      <div class="line">계기번호 <strong id="meterCountText">0개</strong></div>
    </div>
    <div class="actionrow">
      <button class="btn-reset" id="resetBtn">↻ 초기화</button>
      <button class="btn-done" id="doneBtn">✓ 완료</button>
      <button class="btn-hold" id="holdBtn">Ⅱ 보류</button>
    </div>
    <div class="actionrow" style="padding-top:0">
      <button class="btn-bad" id="badBtn" style="grid-column:1/-1">✕ 불가</button>
    </div>
    <div class="reasonbox" id="reasonBox">
      <textarea id="reasonInput" placeholder="불가 사유를 수기로 입력하세요."></textarea>
      <button class="save" id="reasonSave">불가 사유 저장</button>
    </div>
    <div class="filterbar">변대주 → DCUID</div>
    <div class="meter-list" id="meterList"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

function loadJson(key, fallback={}) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch(e){ return fallback; }
}

function normalizeAddress(a){ return String(a||"").replace(/\s+/g," ").trim(); }

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(STORE_DATA)) d.createObjectStore(STORE_DATA,{keyPath:"id"});
      if(!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META,{keyPath:"key"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbGetAll(store){ return new Promise((resolve,reject)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}); }
function idbPutAll(store,items){ return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite"),os=tx.objectStore(store);items.forEach(x=>os.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); }
function idbPut(store,item){ return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); }
function idbClear(store){ return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); }

function dataKey(x){ return `${String(x.DCUID||"").trim()}|${String(x.계기번호||x.id||"").trim()}`; }
function uniqueDataId(x){ return dataKey(x) || `${normalizeAddress(x.주소)}|${Date.now()}|${Math.random()}`; }
function mapRow(row){
  const keys=Object.keys(row);
  const find=(names)=>{const k=keys.find(k=>names.includes(String(k).replace(/\s/g,""))); return k?row[k]:""};
  const meter=find(["계기번호","계기 번호","meter","METER"]) || row["계기번호"] || "";
  const addr=find(["주소","구주소","지번주소","주소(구주소)"]) || "";
  return {id:String(meter||uniqueDataId(row)),계기번호:String(meter||""),DCUID:String(find(["DCUID","DCU ID","DCUID"])||""),변대주:String(find(["변대주"])||""),인입주:String(find(["인입주"])||""),검침일:String(find(["검침일"])||""),주소:String(addr),상호명:String(find(["상호명"])||""),공동주택명:String(find(["공동주택명","공동주택"])||""),addressKey:normalizeAddress(addr),re:false};
}

async function addExcelFile(file){

    const key=dataKey(x);
    if(key && existingKeys.has(key)){skip++;continue;}
    x.id=key||uniqueDataId(x);
    x.re=existingAddresses.has(x.addressKey);
    if(x.re)dup++;
    incoming.push(x); existingKeys.add(key);
  }
  if(!incoming.length){toast(`추가할 새 데이터가 없습니다 · 중복 ${skip}건`);return;}
  DATA.push(...incoming);
  await idbPutAll(STORE_DATA,incoming);
  meta={key:"meta",initialized:true}; await idbPut(STORE_META,meta);
  $("drawer").classList.remove("open");
  await geocodeAll();
  toast(`엑셀 ${incoming.length}건 추가 · 재주소 ${dup}건`);
}

function backupData(){
  const payload={version:3,createdAt:new Date().toISOString(),data:DATA,geoCache,states};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`AMI_데이터_백업_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("데이터를 백업했습니다");
}
async function restoreBackup(file){
  try{const text=await file.text(),p=JSON.parse(text);if(!Array.isArray(p.data))throw new Error();
    DATA=p.data; geoCache=p.geoCache||{}; states=p.states||{};
    await idbClear(STORE_DATA); await idbPutAll(STORE_DATA,DATA);
    await idbPut(STORE_META,{key:"meta",initialized:true});
    localStorage.setItem(CACHE_KEY,JSON.stringify(geoCache));saveStates();
    $("drawer").classList.remove("open"); await geocodeAll(); toast(`백업 복원 완료 · ${DATA.length}건`);
  }catch(e){toast("백업 파일을 읽을 수 없습니다");}
}
async function resetAllData(){
  if(!confirm("모든 AMI 데이터, 좌표 캐시, 완료/보류/불가 상태를 이 기기에서 삭제할까요?"))return;
  await idbClear(STORE_DATA); await idbClear(STORE_META); DATA=[];geoCache={};states={};localStorage.removeItem(CACHE_KEY);localStorage.removeItem(STATE_KEY);
  markerGroups=[];renderMarkers();updateStats();$("drawer").classList.remove("open");toast("전체 데이터가 초기화되었습니다");
}
async function reGeocodeAll(){
  if(!DATA.length){toast("데이터가 없습니다");return;}
  if(!confirm("저장된 좌표를 모두 삭제하고 주소를 다시 검색할까요?"))return;
  geoCache={};localStorage.removeItem(CACHE_KEY);$("drawer").classList.remove("open");await geocodeAll();toast("좌표 재검색이 완료되었습니다");
}

function makeMarkerImage(group){
  const st=stateFor(group), color=statusColor(st.status);
  const count=group.items.length>99?"99+":String(group.items.length);
  const hasRe=group.items.some(x=>x.re);
  const width=34,height=48;
  const reHtml=hasRe?`<text x="17" y="9" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="900" fill="#ef4444">재</text>`:"";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    ${reHtml}
    <path d="M17 5C10 5 4.5 10.6 4.5 17.4C4.5 26.2 17 41 17 41S29.5 26.2 29.5 17.4C29.5 10.6 24 5 17 5Z" fill="${color}" stroke="#fff" stroke-width="2"/>
    <circle cx="17" cy="17" r="8.2" fill="#fff"/>
    <text x="17" y="20.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="${count.length>2?7.5:9}" font-weight="800" fill="${color}">${count}</text>
  </svg>`;
  return new kakao.maps.MarkerImage("data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),new kakao.maps.Size(width,height),{offset:new kakao.maps.Point(17,41)});
}

function updateStats(){
  let done=0,hold=0,bad=0,pending=0;
  markerGroups.forEach(g=>{
    const s=stateFor(g).status;
    if(s==="done")done++; else if(s==="hold")hold++; else if(s==="bad")bad++; else pending++;
  });
  $("sAll").textContent=DATA.length;
  $("sMarker").textContent=markerGroups.length;
  $("sDone").textContent=done;
  $("sHold").textContent=hold;
  $("sBad").textContent=bad;
  $("sPending").textContent=pending;
  $("statusBadge").textContent=`계기 ${DATA.length} · 마커 ${markerGroups.length} · 미처리 ${pending}`;
}

function setProgress(done,total,text){
  $("progressText").textContent=text;
  $("progressBar").style.width = total ? `${Math.round(done/total*100)}%` : "0%";
}
function showProgress(show){ $("progress").classList.toggle("show",show); }

function geocodeOne(address){
  return new Promise(resolve=>{
    const a=normalizeAddress(address);
    if(geoCache[a]) return resolve(geoCache[a]);
    geocoder.addressSearch(a,(result,status)=>{
      if(status===kakao.maps.services.Status.OK && result && result[0]){
        const p={lat:Number(result[0].y),lng:Number(result[0].x),road:result[0].road_address?.address_name||"",place:result[0].address_name||""};
        geoCache[a]=p; localStorage.setItem(CACHE_KEY,JSON.stringify(geoCache));
        resolve(p);
      }else resolve(null);
    });
  });
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function geocodeAll(){
  const unique=[...new Set(DATA.map(x=>normalizeAddress(x.주소)).filter(Boolean))];
  let done=0, failed=0;
  showProgress(true);
  for(const address of unique){
    if(!geoCache[address]){
      const p=await geocodeOne(address);
      if(!p) failed++;
      await sleep(120);
    }
    done++;
    setProgress(done,unique.length,`${done}/${unique.length} 주소 변환 완료${failed?` · 실패 ${failed}`:""}`);
  }
  showProgress(false);
  buildGroups();
}

function buildGroups(){
  const previousStates=new Map();
  for(const oldGroup of markerGroups){
    const oldState=stateFor(oldGroup);
    if(oldState.status!=="pending" || oldState.reason || oldState.date){
      previousStates.set(`${oldGroup.lat.toFixed(6)},${oldGroup.lng.toFixed(6)}`,oldState);
    }
  }
  const byCoord=new Map();
  for(const item of DATA){
    const p=geoCache[normalizeAddress(item.주소)];
    if(!p) continue;
    const key=`${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
    if(!byCoord.has(key)) byCoord.set(key,{key:"",lat:p.lat,lng:p.lng,items:[]});
    byCoord.get(key).items.push(item);
  }
  markerGroups=[...byCoord.values()];
  markerGroups.forEach(g=>{
    g.items.sort((a,b)=>a.계기번호.localeCompare(b.계기번호));
    g.key=g.items.map(x=>x.계기번호).sort().join("|");
    const coordKey=`${g.lat.toFixed(6)},${g.lng.toFixed(6)}`;
    if(!states[g.key] && previousStates.has(coordKey)) states[g.key]=previousStates.get(coordKey);
  });
  saveStates();
  renderMarkers();
  updateStats();
}

function renderMarkers(){
  markerObjects.forEach(m=>m.setMap(null));
  markerObjects=[];
  const bounds=new kakao.maps.LatLngBounds();
  for(const g of markerGroups){
    const st=stateFor(g);
    if(showingPendingOnly && st.status!=="pending") continue;
    const marker=new kakao.maps.Marker({
      map, position:new kakao.maps.LatLng(g.lat,g.lng),
      image:makeMarkerImage(g),
      title:`${g.items.length}개`
    });
    marker.addListener("click",()=>openDetail(g));
    markerObjects.push(marker);
    bounds.extend(marker.getPosition());
  }
  if(markerObjects.length && !showingPendingOnly) map.setBounds(bounds);
}

function refreshGroupMarker(g){
  const idx=markerGroups.indexOf(g);
  if(idx<0) return;
  const target=markerObjects.find(m=>Math.abs(m.getPosition().getLat()-g.lat)<1e-9 && Math.abs(m.getPosition().getLng()-g.lng)<1e-9);
  if(target) target.setImage(makeMarkerImage(g));
  else renderMarkers();
  updateStats();
}

function openDetail(g){
  selectedGroup=g;
  const st=stateFor(g);
  $("detailTitle").textContent = g.items[0]?.주소 || "주소";
  $("detailAddress").textContent = `${g.lat.toFixed(6)}, ${g.lng.toFixed(6)} · ${g.items.length}개`;
  $("statusText").textContent=statusLabel(st.status);
  $("workDate").textContent=st.date ? `작업일 ${st.date}` : "작업일 미기록";
  $("meterCountText").textContent=`${g.items.length}개`;
  $("reasonInput").value=st.reason||"";
  $("reasonBox").classList.toggle("show",st.status==="bad");
  const common=g.items[0]||{};
  const commonDcu=esc(common.DCUID||"");
  const commonDcuHtml=commonDcu.length>=2 ? `${commonDcu.slice(0,-2)}<span class="last2">${commonDcu.slice(-2)}</span>` : commonDcu;
  $("meterList").innerHTML=`<div class="group-summary">
      <div class="row"><div class="k">DCUID</div><div class="v dcu">${commonDcuHtml} <button class="copy" data-copy="${esc((common.DCUID||"").slice(0,8))}">앞 8자리 복사</button></div></div>
      <div class="row"><div class="k">인입주</div><div class="v">${fmt(common.인입주)}</div></div>
      <div class="row"><div class="k">검침일</div><div class="v">${fmt(common.검침일)}일</div></div>
    </div>
    ${g.items.map((x,i)=>{
      return `<article class="meter-card">
        <div class="meter-top">
          <div class="meter-num">${esc(x.계기번호)}</div>
          <button class="copy" data-copy="${esc(x.계기번호)}">복사</button>
          <span class="tag ${st.status==="done"?"gray":st.status==="hold"?"sky":st.status==="bad"?"red":"green"}">${statusLabel(st.status)}</span>
        </div>
        <div class="detail-grid">
          <div class="k">상호명</div><div class="v">${fmt(x.상호명)}</div>
          <div class="k">공동주택명</div><div class="v">${fmt(x.공동주택명)}</div>
          <div class="k">주소</div><div class="v">${fmt(x.주소)}</div>
        </div>
      </article>`;
    }).join("")}`;

  $("detailOverlay").classList.add("show");
}
function closeDetail(){ $("detailOverlay").classList.remove("show"); selectedGroup=null; }

async function copyText(text){
  try{await navigator.clipboard.writeText(text); toast("복사했습니다");}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("복사했습니다");}
}
function toast(msg){
  $("toast").textContent=msg;$("toast").classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.remove("show"),1400);
}
function applyStatus(status,reason=""){
  if(!selectedGroup)return;
  const key=selectedGroup.key, old=stateFor(selectedGroup);
  const nextStatus=(old.status===status && status!=="pending")?"pending":status;
  states[key]={status:nextStatus,reason:nextStatus==="bad"?reason:"",date:nextStatus==="pending"?"":todayMD()};
  saveStates();
  refreshGroupMarker(selectedGroup);
  closeDetail();
}
function searchData(q){
  q=q.trim().toLowerCase();
  if(!q)return;
  const g=markerGroups.find(g=>g.items.some(x=>
    x.계기번호.toLowerCase().includes(q) || x.주소.toLowerCase().includes(q) ||
    x.DCUID.toLowerCase().includes(q) || x.상호명.toLowerCase().includes(q) || x.공동주택명.toLowerCase().includes(q)
  ));
  if(!g){toast("검색 결과가 없습니다");return;}
  map.setCenter(new kakao.maps.LatLng(g.lat,g.lng));map.setLevel(3);
  openDetail(g);
  $("searchBox").classList.remove("open");
}
function moveToCurrent(){
  if(!navigator.geolocation){toast("이 브라우저에서 위치 기능을 지원하지 않습니다");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const loc=new kakao.maps.LatLng(lat,lng);
    if(currentLocationMarker)currentLocationMarker.setMap(null);
    if(currentAccuracyCircle)currentAccuracyCircle.setMap(null);
    currentLocationMarker=new kakao.maps.Marker({map,position:loc});
    currentAccuracyCircle=new kakao.maps.Circle({map,center:loc,radius:Math.max(pos.coords.accuracy||30,20),strokeWeight:1,strokeColor:"#3b82f6",strokeOpacity:.7,fillColor:"#3b82f6",fillOpacity:.12});
    map.setCenter(loc);map.setLevel(3);toast("현재 위치로 이동했습니다");
  },()=>toast("위치 권한을 허용해 주세요"),{enableHighAccuracy:true,timeout:10000,maximumAge:10000});
}
function openNav(kind){
  if(!selectedGroup)return;
  const {lat,lng}=selectedGroup;
  const a=encodeURIComponent(`${lat},${lng}`);
  if(kind==="kakao")location.href=`https://map.kakao.com/link/map/AMI,${lat},${lng}`;
  if(kind==="naver")location.href=`https://map.naver.com/p/directions/-/${lng},${lat}`;
  if(kind==="tmap")location.href=`https://apis.openapi.sk.com/tmap/app/routes?appKey=&name=AMI&lon=${lng}&lat=${lat}`;
}

$("menuBtn").onclick=()=>$("drawer").classList.add("open");
$("drawerClose").onclick=()=>$("drawer").classList.remove("open");
$("searchBtn").onclick=()=>{$("searchBox").classList.toggle("open");if($("searchBox").classList.contains("open"))$("searchInput").focus()};
$("searchGo").onclick=()=>searchData($("searchInput").value);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchData(e.target.value)});
$("locationBtn").onclick=moveToCurrent;
$("detailClose").onclick=closeDetail;
$("doneBtn").onclick=()=>applyStatus("done");
$("holdBtn").onclick=()=>applyStatus("hold");
$("resetBtn").onclick=()=>applyStatus("pending");
$("badBtn").onclick=()=>{
  if(!selectedGroup)return;
  const old=stateFor(selectedGroup);
  if(old.status==="bad" && old.reason){ applyStatus("bad",old.reason); return; }
  $("reasonBox").classList.add("show");$("reasonInput").focus();
};
$("reasonSave").onclick=()=>{const r=$("reasonInput").value.trim();if(!r){toast("불가 사유를 입력해 주세요");return;}applyStatus("bad",r)};
$("meterList").addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");
  if(b){e.stopPropagation();copyText(b.dataset.copy)}
});
$("showAll").onclick=()=>{showingPendingOnly=false;renderMarkers();$("drawer").classList.remove("open")};
$("showPending").onclick=()=>{showingPendingOnly=true;renderMarkers();$("drawer").classList.remove("open")};
$("addExcel").onclick=()=>$("excelInput").click();
$("excelInput").onchange=e=>{const f=e.target.files[0];addExcelFile(f);e.target.value=""};
$("backupData").onclick=backupData;
$("restoreData").onclick=()=>$("restoreInput").click();
$("restoreInput").onchange=e=>{const f=e.target.files[0];restoreBackup(f);e.target.value=""};
$("reGeocode").onclick=reGeocodeAll;
$("resetAll").onclick=resetAllData;
$("tmapBtn").onclick=()=>openNav("tmap");
$("naverBtn").onclick=()=>openNav("naver");
$("kakaoBtn").onclick=()=>openNav("kakao");

async function initKakao(){
  try{ await initStorage(); }catch(e){ $("statusBadge").textContent="브라우저 저장소를 사용할 수 없습니다";showProgress(true);$("progressText").textContent="IndexedDB를 지원하는 브라우저인지 확인하세요.";return; }
  if(!KAKAO_JS_KEY || KAKAO_JS_KEY.includes("여기에_카카오")){
    $("statusBadge").textContent="카카오 JavaScript 키를 설정해 주세요";
    $("progressText").textContent="index.html 상단 KAKAO_JS_KEY에 키를 입력하세요.";
    showProgress(true);return;
  }
  kakao.maps.load(()=>{
    const center=new kakao.maps.LatLng(37.6659,127.0283);
    map=new kakao.maps.Map($("map"),{center,level:4});
    geocoder=new kakao.maps.services.Geocoder();
    geocodeAll();
  });
}

(function loadKakao(){
  const s=document.createElement("script");
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=services&autoload=false`;
  s.onload=initKakao;
  s.onerror=()=>{ $("statusBadge").textContent="카카오 지도 SDK를 불러오지 못했습니다"; showProgress(true); $("progressText").textContent="JavaScript 키와 GitHub Pages 도메인 등록을 확인하세요."; };
  document.head.appendChild(s);
})();
</script>
